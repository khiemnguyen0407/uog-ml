# =====================================================================
#  Shared settings for all Quarto documents in this folder.
#  Every .qmd file only needs a short header with `title` and `subtitle`;
#  everything below is inherited automatically.
#
#  Render everything (HTML + PDF):    quarto render
#  Render one file, one format:       quarto render 01-tensors.qmd --to pdf
#  Live preview while editing:        quarto preview 01-tensors.qmd
# =====================================================================

project:
  type: default
  output-dir: _output          # rendered HTML/PDF files are written here
  render:
    - "*.qmd"                  # render only the .qmd files, not the .ipynb notebooks

# ---------------------------------------------------------------------
#  Document metadata
# ---------------------------------------------------------------------
author:
  - name: Khiem Nguyen
    affiliations:
      - name: James Watt School of Engineering, University of Glasgow
date: last-modified
date-format: "D MMMM YYYY"
lang: en-GB

# ---------------------------------------------------------------------
#  Code execution
# ---------------------------------------------------------------------
jupyter: python3
execute:
  echo: true                   # show the code
  warning: true                # show warnings (individual cells may override)
  freeze: auto                 # re-run code only when a .qmd file changes

# ---------------------------------------------------------------------
#  Options common to all output formats
# ---------------------------------------------------------------------
number-sections: true
toc: true
toc-depth: 2
fig-align: center
crossref:
  fig-prefix: Figure

# ---------------------------------------------------------------------
#  Output formats
# ---------------------------------------------------------------------
format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
    toc-location: left
    toc-title: Contents
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    embed-resources: true      # one self-contained .html file per notebook
    include-before-body: assets/banner.html
    title-block-banner: false

  pdf:
    documentclass: scrartcl
    papersize: a4
    fontsize: 11pt
    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm
      - headheight=14pt
    pdf-engine: xelatex
    include-in-header: assets/preamble.tex
    colorlinks: true
    linkcolor: UofGBlue
    urlcolor: UofGBlue
    citecolor: UofGBlue
    fig-pos: "H"               # keep figures where they appear in the text
    code-block-bg: "#F4F6F9"
    code-block-border-left: "#003865"
    highlight-style: github
    df-print: default
